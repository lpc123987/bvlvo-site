name: Collaborator introduction
description: Offer documentation or testnet review contributions; no automatic signing authority.
title: "[Contribution] "
body:
  - type: markdown
    attributes:
      value: "Test assets only. This public introduction is not a job offer, signer appointment or token allocation. Compensation is not agreed. Do not post identity documents, private contact details or wallet secrets. No application fee is required."
  - type: dropdown
    id: role
    attributes:
      label: Area of interest
      options:
        - English documentation
        - Solidity and testnet review
        - Prospective Safe signer (separate vetting required)
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Relevant public work and proposed contribution
      description: Link public examples and describe one specific task you could help with.
    validations:
      required: true
  - type: input
    id: availability
    attributes:
      label: Approximate availability
      placeholder: e.g. 2 hours per week
  - type: markdown
    attributes:
      value: "Keep this issue link to follow replies. Open means submitted, not accepted. Maintainers may request more information or close the issue with a reason. Response times and review capacity are not guaranteed."
