<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BVLVO responsive preview</title><style>body{margin:0;background:#20252b;color:white;font:16px Arial}header{padding:12px;display:flex;gap:15px;align-items:center}select{font:16px Arial;padding:8px}iframe{display:block;border:1px solid #555;margin:0 auto;height:790px;background:#06080b}</style></head><body><header><label>Width <select id="width"><option>390</option><option>320</option><option>768</option><option>1280</option></select></label><label>Page <select id="page"><option value="/">Home</option><option value="/research/">Research</option><option value="/research/paper-01/">Paper 01</option><option value="/research/notes/">Research Notes</option><option value="/docs/">Docs</option><option value="/development/">History</option><option value="/disclosures/">Disclosures</option></select></label><span id="result"></span></header><iframe title="Responsive page" id="site" src="/" width="390"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>{frame.width=e.target.value;setTimeout(check,200)};document.querySelector('#page').onchange=e=>frame.src=e.target.value;function check(){const d=frame.contentDocument;document.querySelector('#result').textContent=frame.contentWindow.innerWidth+'px / content '+d.documentElement.scrollWidth+'px'}frame.onload=check;</script></body></html>
